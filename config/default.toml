[application]
mode = "paper"
language = "zh_CN"

[ui]
form = "mainwindow.ui"
stylesheet = "dark.qss"
restore_geometry = true
restore_splitters = true
refresh_interval_ms = 250

[opportunity]
default_scan_amount = "1000"
minimum_net_profit = "1.00"
minimum_funding_rate = "0"
profitable_only = true
executable_only = true

[execution]
default_order_type = "IOC_LIMIT"
default_margin_mode = "ISOLATED"
default_leverage = 5
spot_max_slippage_percent = "0.10"
perpetual_max_slippage_percent = "0.10"
margin_buffer_usdt = "100"

[database]
path = "data/arbitrage.db"
driver = "sqlite3"
